<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>treegen — a tool for growing trees on a grid</title>
<link rel="stylesheet" href="treegen.css">
<style>
  /* Enough page around the tool for it to stand on its own. The tool brings
     its own styling; this is only the room it sits in — paper, a grotesque,
     and margins on the tool's own baseline. */
  html, body { margin: 0; min-height: 100%; }
  body {
    background: oklch(97.5% 0 0);
    color: oklch(17% 0 0);
    font-family: Archivo, 'Helvetica Neue', Helvetica, Arial, system-ui, sans-serif;
    font-size: 14px;
    -webkit-font-smoothing: antialiased;
    padding: 2.5rem 0;
  }
  h1, h2, h3, p { margin: 0; }
</style>
</head>
<body>
<!-- treegen brings its own chrome; this is only where it goes. -->
<div id='treegen'></div>

<script type="module" src="./treegen.js"></script>
</body>
</html>
